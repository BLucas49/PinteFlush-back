name: CI

on:
  pull_request:
    branches: [dev]

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Vérification de qualitées
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Lintint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build
